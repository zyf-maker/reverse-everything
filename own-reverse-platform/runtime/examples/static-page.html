<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Runtime fixture</title></head>
<body>
  <button id="increment">Increment</button>
  <output id="value">0</output>
  <script>
    let value = 0;
    if (new URLSearchParams(location.search).has('probe')) {
      fetch('http://127.0.0.1:8771/blocked').catch(() => {});
    }
    document.querySelector('#increment').addEventListener('click', () => {
      value += 1;
      document.querySelector('#value').textContent = String(value);
      localStorage.setItem('value', String(value));
      console.info('value', value);
    });
  </script>
</body>
</html>
