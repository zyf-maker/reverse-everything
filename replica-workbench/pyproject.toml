[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replica-workbench"
version = "0.1.0"
description = "Evidence-driven behavioral reconstruction workbench"
requires-python = ">=3.10"

[project.scripts]
replica = "replica_platform.cli:main"

[project.optional-dependencies]
test = []

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
